name: Обновление АнтиБабкаВПН

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: antibabkavpn-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install PyYAML
      - name: Download public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources out
          fetch() {
            local url="$1" dest="$2"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$url" -o "$dest" || { echo "Failed: $url"; return 1; }
          }
          base=https://raw.githubusercontent.com
          fetch "$base/zieng2/wl/main/vless_universal.txt" sources/universal.txt
          fetch "$base/zieng2/wl/main/vless_lite.txt" sources/lite.txt
          for file in WHITE-CIDR-RU-all.txt WHITE-SNI-RU-all.txt WHITE-CIDR-RU-checked.txt BLACK_VLESS_RUS.txt; do
            fetch "$base/igareck/vpn-configs-for-russia/main/$file" "sources/$file"
          done
          fetch "$base/tiagorrg/vless-checker/main/docs/keys.json" sources/keys.json
          python extract_keys.py sources/keys.json sources/keys.txt
          fetch "$base/whoahaow/rjsxrd/main/githubmirror/bypass/bypass-all.txt" sources/bypass.txt
          cat sources/universal.txt sources/lite.txt sources/WHITE-CIDR-RU-all.txt sources/WHITE-SNI-RU-all.txt sources/WHITE-CIDR-RU-checked.txt > sources/wl.txt
          cat sources/BLACK_VLESS_RUS.txt > sources/bl.txt
          test -s sources/wl.txt
      - name: Install Xray
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -p /tmp/xray.zip xray > /tmp/xray
          chmod +x /tmp/xray
          /tmp/xray version
      - name: Probe servers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -I probe.py /tmp/xray build.py probe.json sources/wl.txt sources/bl.txt sources/keys.txt sources/bypass.txt
      - name: Build subscriptions
        run: |
          python -I build.py 'sources/wl.txt,sources/bl.txt=bl,sources/keys.txt=auto,sources/bypass.txt=cap' out --alive probe.json
          test -s out/all.txt
          test -s out/auto.json
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          for file in all.txt whitelist.txt ai.txt regular.txt ru_only.txt auto.json clash_whitelist.yaml clash_regular.yaml stats.json; do
            test -s "out/$file"
            cp "out/$file" "$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all.txt whitelist.txt ai.txt regular.txt ru_only.txt auto.json clash_whitelist.yaml clash_regular.yaml stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Обновить подписки'
            git push
          fi
